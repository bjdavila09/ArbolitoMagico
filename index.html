<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arbolito Mágico</title>
<style>
  :root {
    --panel: rgba(16, 27, 62, .78);
    --panel-2: rgba(40, 60, 128, .85);
    --accent: #ffd54f;
    --text: #f3f6ff;
    --muted: #b8c6f0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--text);
    background: linear-gradient(#07102a, #1a2b5c);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  /* Cámara a pantalla completa, detrás de todo */
  #video {
    position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover;
    transform: scaleX(-1); display: none; z-index: 0; pointer-events: none; opacity: .8;
  }
  #app {
    position: relative; z-index: 1;
    height: 100dvh; display: grid; gap: 10px; padding: 10px;
    grid-template-columns: 130px 1fr 130px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "bar bar bar" "orn tree col";
  }
  #bar {
    grid-area: bar; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border-radius: 14px; padding: 8px 12px;
    backdrop-filter: blur(6px);
  }
  #bar h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  #status { color: var(--muted); font-size: 13px; flex: 1; min-width: 160px; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 2px solid transparent;
    border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: #2e7d32; }
  .btn.hover, .btn:hover { border-color: var(--accent); }
  #camTools {
    display: none; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px;
    border: 2px solid transparent; font-size: 13px; color: var(--muted);
  }
  #camTools.hover { border-color: var(--accent); }
  #camTools input[type=range] { width: 130px; accent-color: var(--accent); height: 26px; }
  .panel {
    background: var(--panel); border-radius: 14px; padding: 8px;
    display: flex; flex-direction: column; gap: 8px; overflow: auto; backdrop-filter: blur(6px);
  }
  #orn { grid-area: orn; }
  #col { grid-area: col; flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: flex-start; }
  .orn-btn {
    background: var(--panel-2); border: 3px solid transparent; border-radius: 12px;
    padding: 6px 4px; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 12px; cursor: pointer;
  }
  .orn-btn canvas { width: 56px; height: 56px; pointer-events: none; }
  .orn-btn.sel { border-color: var(--accent); }
  .orn-btn.hover { border-color: #fff; }
  .col-btn {
    width: 48px; height: 48px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); cursor: pointer;
  }
  .col-btn.sel { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
  .col-btn.hover { border-color: #fff; transform: scale(1.1); }
  #treeWrap { grid-area: tree; position: relative; border-radius: 14px; overflow: hidden; }
  #tree { width: 100%; height: 100%; display: block; }
  #hint {
    position: absolute; left: 10px; bottom: 10px; max-width: 60%; font-size: 12px; color: #dfe7ff;
    background: rgba(8,14,36,.65); padding: 6px 10px; border-radius: 10px; pointer-events: none;
  }
  .cursor {
    position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    border: 3px solid #fff; border-radius: 50%; pointer-events: none; display: none; z-index: 10;
    box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 0 12px rgba(255,255,255,.6);
    transition: background .08s;
  }
  .cursor.b { border-color: #4dd0e1; box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 0 12px rgba(77,208,225,.8); }
  .cursor.pinch { background: rgba(255,213,79,.85); border-color: var(--accent); }
  @media (max-width: 760px) {
    #app {
      grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto;
      grid-template-areas: "bar" "orn" "tree" "col";
    }
    #orn { flex-direction: row; justify-content: center; }
    .orn-btn canvas { width: 40px; height: 40px; }
    .col-btn { width: 38px; height: 38px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<video id="video" playsinline muted></video>

<div id="app">
  <div id="bar">
    <h1>🎄 Arbolito Mágico</h1>
    <div id="status">Toca “Activar cámara” para usar las manos, o usa el ratón / el dedo.</div>
    <div id="camTools" data-slider>
      <span>Cámara</span>
      <input type="range" id="opacity" min="0" max="100" value="80" data-slider aria-label="Opacidad de la cámara">
    </div>
    <button class="btn primary" id="camBtn" data-action="camera">Activar cámara</button>
    <button class="btn" data-action="clear">Limpiar</button>
    <button class="btn" data-action="save">Guardar imagen</button>
  </div>

  <div id="orn" class="panel"></div>

  <div id="treeWrap">
    <canvas id="tree"></canvas>
    <div id="hint">Pellizca (pulgar + índice) un adorno, llévalo al árbol y abre los dedos para soltarlo. Pellizca un color para pintarlo. Puedes usar las dos manos a la vez. Suelta un adorno fuera del árbol para quitarlo.</div>
  </div>

  <div id="col" class="panel"></div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ---------- Datos ---------- */
const ORNAMENTS = [
  { id: "star",  name: "Estrella" },
  { id: "ball",  name: "Bola" },
  { id: "heart", name: "Corazón" },
  { id: "bell",  name: "Campana" },
  { id: "gift",  name: "Regalo" },
];
const COLORS = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa", "#ec407a", "#f5f5f5"];

let curType = "star";
let curColor = COLORS[0];
let orns = [];          // { type, color, x, y }  (x, y normalizados 0..1 sobre el lienzo)
let selected = null;    // adorno colocado seleccionado (compartido por las dos manos)

/* ---------- Utilidades ---------- */
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- Dibujo de adornos ---------- */
function drawOrnament(ctx, type, x, y, r, color) {
  ctx.save();
  ctx.lineWidth = Math.max(1.5, r * 0.08);
  ctx.strokeStyle = shade(color, 0.6);
  ctx.fillStyle = color;
  ctx.lineJoin = "round";
  if (type === "star") {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 5;
      const rad = i % 2 === 0 ? r * 1.15 : r * 0.5;
      const px = x + Math.cos(ang) * rad, py = y + Math.sin(ang) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (type === "ball") {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.25, color); g.addColorStop(1, shade(color, 0.6));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y + r * 0.1, r * 0.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#d4af37";
    ctx.fillRect(x - r * 0.25, y - r * 0.95, r * 0.5, r * 0.3);
  } else if (type === "heart") {
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.9);
    ctx.bezierCurveTo(x + r * 1.3, y + r * 0.1, x + r * 0.7, y - r * 0.9, x, y - r * 0.3);
    ctx.bezierCurveTo(x - r * 0.7, y - r * 0.9, x - r * 1.3, y + r * 0.1, x, y + r * 0.9);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (type === "bell") {
    ctx.beginPath();
    ctx.moveTo(x - r * 0.95, y + r * 0.7);
    ctx.bezierCurveTo(x - r * 0.9, y - r * 0.2, x - r * 0.6, y - r * 0.95, x, y - r * 0.95);
    ctx.bezierCurveTo(x + r * 0.6, y - r * 0.95, x + r * 0.9, y - r * 0.2, x + r * 0.95, y + r * 0.7);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#d4af37";
    ctx.beginPath(); ctx.arc(x, y + r * 0.8, r * 0.25, 0, Math.PI * 2); ctx.fill();
  } else if (type === "gift") {
    const w = r * 1.7, h = r * 1.4, x0 = x - w / 2, y0 = y - h / 2 + r * 0.1;
    ctx.fillRect(x0, y0, w, h); ctx.strokeRect(x0, y0, w, h);
    ctx.fillStyle = "#fff8e1";
    ctx.fillRect(x - r * 0.15, y0, r * 0.3, h);
    ctx.fillRect(x0, y0 + h / 2 - r * 0.15, w, r * 0.3);
    ctx.beginPath(); ctx.arc(x - r * 0.25, y0 - r * 0.1, r * 0.25, 0, Math.PI * 2);
    ctx.arc(x + r * 0.25, y0 - r * 0.1, r * 0.25, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ---------- Paneles ---------- */
const ornPanel = document.getElementById("orn");
const colPanel = document.getElementById("col");
const iconCanvases = {};

ORNAMENTS.forEach(o => {
  const b = document.createElement("div");
  b.className = "orn-btn"; b.dataset.orn = o.id;
  const c = document.createElement("canvas"); c.width = 112; c.height = 112;
  const s = document.createElement("span"); s.textContent = o.name;
  b.append(c, s); ornPanel.append(b);
  iconCanvases[o.id] = c;
});
COLORS.forEach(col => {
  const b = document.createElement("div");
  b.className = "col-btn"; b.dataset.color = col; b.style.background = col;
  colPanel.append(b);
});

function refreshPanels() {
  for (const o of ORNAMENTS) {
    const c = iconCanvases[o.id], ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    drawOrnament(ctx, o.id, 56, 58, 34, curColor);
  }
  document.querySelectorAll(".orn-btn").forEach(b => b.classList.toggle("sel", b.dataset.orn === curType));
  document.querySelectorAll(".col-btn").forEach(b => b.classList.toggle("sel", b.dataset.color === curColor));
}
refreshPanels();

/* ---------- Lienzo del árbol (transparente: la cámara se ve detrás) ---------- */
const canvas = document.getElementById("tree");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
const snow = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + 0.5 }));

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(canvas);
window.addEventListener("resize", resize);
resize();

function geom() {
  const cx = W / 2;
  const apexY = H * 0.12, baseY = H * 0.80;
  const halfW = Math.min(W * 0.42, (baseY - apexY) * 0.52);
  return { cx, apexY, baseY, halfW };
}
const ornR = () => Math.max(20, Math.min(W, H) * 0.05);

function insideTree(x, y) {
  const g = geom();
  const top = g.apexY - ornR() * 1.2, bottom = g.baseY + ornR() * 0.5;
  if (y < top || y > bottom) return false;
  const t = Math.max(0, (y - g.apexY) / (g.baseY - g.apexY));
  const half = g.halfW * t * 1.04 + ornR() * 0.8;
  return Math.abs(x - g.cx) <= half;
}

let camAlpha = 0.8, camVisible = false;

function drawScene() {
  ctx.clearRect(0, 0, W, H);
  // Nieve y suelo se atenúan cuando la cámara se ve más (para no tapar la imagen real)
  const bgAlpha = camVisible ? 1 - camAlpha : 1;
  if (bgAlpha > 0.02) {
    ctx.save(); ctx.globalAlpha = bgAlpha;
    ctx.fillStyle = "rgba(255,255,255,.8)";
    for (const s of snow) { ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#e8f0ff";
    ctx.beginPath(); ctx.ellipse(W / 2, H * 0.90, W * 0.6, H * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  const g = geom();
  ctx.fillStyle = "#6d4c41";
  ctx.fillRect(g.cx - g.halfW * 0.12, g.baseY - 4, g.halfW * 0.24, H * 0.09);

  const tiers = [[0, 0.46, 0.50], [0.26, 0.76, 0.78], [0.5, 1, 1]];
  const greens = ["#2e7d32", "#388e3c", "#43a047"];
  const span = g.baseY - g.apexY;
  tiers.forEach(([t0, t1, wf], i) => {
    const yTop = g.apexY + span * t0, yBot = g.apexY + span * t1;
    const half = g.halfW * (i === 2 ? 1 : wf + 0.1);
    ctx.fillStyle = greens[i];
    ctx.strokeStyle = "#1b5e20"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(g.cx, yTop);
    ctx.lineTo(g.cx + half, yBot);
    ctx.lineTo(g.cx - half, yBot);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });
}

function draw() {
  drawScene();
  const r = ornR();
  for (const o of orns) {
    const px = o.x * W, py = o.y * H;
    if (o === selected) {
      ctx.save(); ctx.strokeStyle = "#ffd54f"; ctx.lineWidth = 3; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.arc(px, py, r * 1.5, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    drawOrnament(ctx, o.type, px, py, r, o.color);
  }
  const rect = canvas.getBoundingClientRect();
  for (const p of pointers.values()) {
    if (!p.held) continue;
    const px = p.x - rect.left, py = p.y - rect.top;
    ctx.save();
    ctx.globalAlpha = 0.95; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 14;
    drawOrnament(ctx, p.held.item.type, px, py, r * 1.25, p.held.item.color);
    ctx.restore();
    if (!insideTree(px, py)) {
      ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,.8)"; ctx.shadowBlur = 4;
      ctx.fillText(p.held.isNew ? "Llévalo al árbol" : "Suelta aquí para quitarlo", px, py - r * 1.8);
      ctx.shadowBlur = 0;
    }
  }
}

/* ---------- Punteros: ratón, táctil y cada mano (todos independientes) ---------- */
const pointers = new Map();
function getPointer(id) {
  let p = pointers.get(id);
  if (!p) {
    p = { id, x: -100, y: -100, held: null, slider: false, isHand: false, pinched: false, seen: 0, cur: { x: 0, y: 0 }, cursor: null };
    pointers.set(id, p);
  }
  return p;
}

const statusEl = document.getElementById("status");
const setStatus = t => { statusEl.textContent = t; };
const sliderEl = document.getElementById("opacity");
const videoEl = document.getElementById("video");

const SEL = "[data-orn],[data-color],[data-action],[data-slider]";
function elAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest(SEL) : null;
}

function applyOpacity() {
  camAlpha = sliderEl.value / 100;
  videoEl.style.opacity = camAlpha;
}
function setSlider(x) {
  const r = sliderEl.getBoundingClientRect();
  sliderEl.value = Math.round(clamp((x - r.left) / r.width, 0, 1) * 100);
  applyOpacity();
}
sliderEl.addEventListener("input", applyOpacity);

function pointerDown(p, x, y) {
  p.x = x; p.y = y;
  const btn = elAt(x, y);
  if (btn) {
    if (btn.hasAttribute("data-slider")) {
      p.slider = true; setSlider(x);
    } else if (btn.dataset.orn) {
      curType = btn.dataset.orn; refreshPanels(); selected = null;
      p.held = { item: { type: curType, color: curColor }, isNew: true };
    } else if (btn.dataset.color) {
      curColor = btn.dataset.color;
      if (selected) selected.color = curColor;
      refreshPanels();
    } else if (btn.dataset.action) {
      runAction(btn.dataset.action);
    }
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const cx = x - rect.left, cy = y - rect.top;
  if (cx < 0 || cy < 0 || cx > W || cy > H) return;
  const r = ornR() * 1.3;
  for (let i = orns.length - 1; i >= 0; i--) {
    const o = orns[i];
    if (Math.hypot(o.x * W - cx, o.y * H - cy) < r) {
      orns.splice(i, 1);
      selected = o;
      p.held = { item: o, isNew: false };
      return;
    }
  }
  selected = null;
}

function pointerMove(p, x, y) {
  p.x = x; p.y = y;
  if (p.slider) setSlider(x);
}

function pointerUp(p, x, y) {
  if (x !== undefined) { p.x = x; p.y = y; }
  p.slider = false;
  if (!p.held) return;
  const rect = canvas.getBoundingClientRect();
  const cx = p.x - rect.left, cy = p.y - rect.top;
  if (insideTree(cx, cy)) {
    const item = { type: p.held.item.type, color: p.held.item.color, x: cx / W, y: cy / H };
    orns.push(item); selected = item;
  } else if (!p.held.isNew) {
    selected = null; // se quita
  }
  p.held = null;
}

function runAction(a) {
  if (a === "camera") startCamera();
  else if (a === "clear") {
    orns = []; selected = null;
    for (const p of pointers.values()) p.held = null;
  } else if (a === "save") saveImage();
}

function saveImage() {
  const iw = window.innerWidth, ih = window.innerHeight;
  const off = document.createElement("canvas");
  off.width = iw; off.height = ih;
  const o = off.getContext("2d");
  const bg = o.createLinearGradient(0, 0, 0, ih);
  bg.addColorStop(0, "#07102a"); bg.addColorStop(1, "#1a2b5c");
  o.fillStyle = bg; o.fillRect(0, 0, iw, ih);
  if (camVisible && videoEl.videoWidth) {
    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
    const sc = Math.max(iw / vw, ih / vh), dw = vw * sc, dh = vh * sc;
    o.save();
    o.globalAlpha = camAlpha;
    o.translate(iw, 0); o.scale(-1, 1);
    o.drawImage(videoEl, (iw - dw) / 2, (ih - dh) / 2, dw, dh);
    o.restore();
  }
  const rect = canvas.getBoundingClientRect();
  o.drawImage(canvas, rect.left, rect.top, rect.width, rect.height);
  off.toBlob(b => {
    const url = URL.createObjectURL(b);
    const l = document.createElement("a"); l.href = url; l.download = "mi-arbolito-magico.png"; l.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });
}

window.addEventListener("pointerdown", e => {
  const id = e.pointerType === "mouse" ? "mouse" : "t" + e.pointerId;
  pointerDown(getPointer(id), e.clientX, e.clientY);
});
window.addEventListener("pointermove", e => {
  const id = e.pointerType === "mouse" ? "mouse" : "t" + e.pointerId;
  pointerMove(getPointer(id), e.clientX, e.clientY);
});
function endPointer(e) {
  const id = e.pointerType === "mouse" ? "mouse" : "t" + e.pointerId;
  const p = pointers.get(id);
  if (!p) return;
  pointerUp(p, e.clientX, e.clientY);
  if (id !== "mouse") pointers.delete(id);
}
window.addEventListener("pointerup", endPointer);
window.addEventListener("pointercancel", endPointer);

/* ---------- Cámara y manos ---------- */
let landmarker = null, camOn = false, lastVideoTime = -1;
let hovered = new Set();

async function startCamera() {
  if (camOn) return;
  const btn = document.getElementById("camBtn");
  try {
    btn.textContent = "Cargando…";
    setStatus("Pidiendo acceso a la cámara…");
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
    });
    videoEl.srcObject = stream;
    await videoEl.play();
    videoEl.style.display = "block";
    camVisible = true;
    document.getElementById("camTools").style.display = "flex";
    applyOpacity();

    setStatus("Cargando el detector de manos (la primera vez tarda unos segundos)…");
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const modelAssetPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
    try {
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath, delegate: "GPU" }, runningMode: "VIDEO", numHands: 2,
      });
    } catch (e) {
      landmarker = await HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath, delegate: "CPU" }, runningMode: "VIDEO", numHands: 2,
      });
    }
    camOn = true;
    btn.style.display = "none";
    setStatus("Listo. Muestra una o las dos manos y pellizca con pulgar e índice para “agarrar”.");
  } catch (err) {
    console.error(err);
    btn.textContent = "Activar cámara";
    setStatus("No se pudo usar la cámara (" + (err.name || "error") + "). Puedes seguir con el ratón o el dedo.");
  }
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// Convierte un punto normalizado del vídeo a coordenadas de pantalla,
// respetando el recorte "cover" y el espejo, para que el cursor quede sobre tu mano real.
function videoToScreen(nx, ny) {
  const vw = videoEl.videoWidth || 640, vh = videoEl.videoHeight || 480;
  const iw = window.innerWidth, ih = window.innerHeight;
  const sc = Math.max(iw / vw, ih / vh), dw = vw * sc, dh = vh * sc;
  const dx = (iw - dw) / 2, dy = (ih - dh) / 2;
  return { x: clamp((1 - nx) * dw + dx, 0, iw), y: clamp(ny * dh + dy, 0, ih) };
}

function updateHand(p, lm, now) {
  p.isHand = true;
  if (!p.cursor) {
    p.cursor = document.createElement("div");
    p.cursor.className = "cursor" + (p.id.endsWith("Left") ? "" : " b");
    document.body.append(p.cursor);
  }
  const thumb = lm[4], index = lm[8];
  // Punto de control: punto medio entre pulgar e índice (estable al pellizcar)
  const t = videoToScreen((thumb.x + index.x) / 2, (thumb.y + index.y) / 2);
  if (!p.seen || now - p.seen > 600) { p.cur.x = t.x; p.cur.y = t.y; }
  p.cur.x += (t.x - p.cur.x) * 0.4;
  p.cur.y += (t.y - p.cur.y) * 0.4;
  p.seen = now;

  // Pellizco con histéresis, relativo al tamaño de la mano
  const scale = dist(lm[0], lm[9]) || 0.1;
  const ratio = dist(thumb, index) / scale;
  const was = p.pinched;
  if (!p.pinched && ratio < 0.30) p.pinched = true;
  else if (p.pinched && ratio > 0.50) p.pinched = false;

  p.cursor.style.display = "block";
  p.cursor.style.transform = `translate(${p.cur.x}px, ${p.cur.y}px) scale(${p.pinched ? 0.7 : 1})`;
  p.cursor.classList.toggle("pinch", p.pinched);
  pointerMove(p, p.cur.x, p.cur.y);
  if (p.pinched && !was) pointerDown(p, p.cur.x, p.cur.y);
  if (!p.pinched && was) pointerUp(p, p.cur.x, p.cur.y);
}

function handLost(p, now) {
  if (p.seen && now - p.seen > 400) {
    if (p.pinched) { p.pinched = false; pointerUp(p); }
    p.cursor.style.display = "none";
    p.seen = 0;
  }
}

function handleResults(res, now) {
  const lms = res.landmarks || [];
  const hd = res.handedness || res.handednesses || [];
  const used = new Set();
  lms.forEach((lm, i) => {
    let label = hd[i] && hd[i][0] ? hd[i][0].categoryName : "H" + i;
    if (used.has(label)) label += i;
    used.add(label);
    updateHand(getPointer("hand-" + label), lm, now);
  });
  for (const p of pointers.values()) {
    if (p.isHand && !used.has(p.id.slice(5))) handLost(p, now);
  }
}

function updateHover() {
  const now = new Set();
  for (const p of pointers.values()) {
    if (p.isHand && p.cursor && p.cursor.style.display === "block") {
      const el = elAt(p.cur.x, p.cur.y);
      if (el) now.add(el);
    }
  }
  for (const el of hovered) if (!now.has(el)) el.classList.remove("hover");
  for (const el of now) if (!hovered.has(el)) el.classList.add("hover");
  hovered = now;
}

function loop() {
  const now = performance.now();
  if (camOn && landmarker && videoEl.readyState >= 2 && videoEl.currentTime !== lastVideoTime) {
    lastVideoTime = videoEl.currentTime;
    handleResults(landmarker.detectForVideo(videoEl, now), now);
  }
  updateHover();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
